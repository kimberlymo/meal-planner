name: Build and Test on Branch
on:
    push:
        branches:
        - '**'
    pull_request:
        branches:
        - '**'

jobs:
    build-and-test:
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v4
        - name: Set up Java
          uses: actions/setup-java@v5.2.0
          with:
            java-version: 21
            distribution: ''
        - name: Setup Gradle
          uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3
        - name: Build with Gradle
          run: ./gradlew package
